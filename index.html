<!doctype html>
<html lang="es" data-version="hibrida">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Portada · RCP Básico</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<link rel="stylesheet" href="assets/css/presets/theme-vital.css" />
<link rel="stylesheet" href="assets/css/core.css" />
<style>
  /* Portada con hero silueteado a la derecha · fundido con el fondo navy */
  .wg-portada{ position:relative; overflow:hidden; }

  .wg-portada__inner{
    display:grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, .9fr);
    gap: 32px;
    align-items:end;
    position:relative;
    z-index: 2;
    min-height: 620px;
  }

  /* Halo radial cálido detrás del personaje (genera el "fade" al fondo) */
  .wg-portada__inner::before{
    content:"";
    position:absolute;
    right:-5%;
    top:50%;
    transform: translateY(-50%);
    width: 55%;
    height: 110%;
    background:
      radial-gradient(ellipse at 50% 45%,
        color-mix(in srgb, var(--c-acento) 22%, transparent) 0%,
        color-mix(in srgb, var(--c-info)   12%, transparent) 35%,
        transparent 70%);
    filter: blur(20px);
    z-index: 0;
    pointer-events:none;
  }

  .wg-portada__text{ position:relative; z-index: 2; }

  .wg-portada__hero{
    position: relative;
    z-index: 1;
    align-self: end;
    margin: 0 -40px -40px 0;     /* sangrado al borde derecho/inferior */
    display:flex;
    justify-content:flex-end;
    align-items:flex-end;
  }
  .wg-portada__hero img{
    display:block;
    width: 100%;
    height: auto;
    max-height: 720px;
    object-fit: contain;
    object-position: bottom right;
    /* Drop-shadow azul para integrar con el navy del fondo */
    filter:
      drop-shadow(0 30px 60px rgba(0,0,0,.45))
      drop-shadow(0 0 80px color-mix(in srgb, var(--c-info) 35%, transparent));
  }

  /* Título del curso · cada línea bloque, "Cardio Pulmonar" en una sola */
  .wg-portada__title{
    display: flex;
    flex-direction: column;
    line-height: 1.02;
    margin: 0;
  }
  .wg-portada__title > span{
    display: block;
    white-space: nowrap;
  }
  .wg-portada__title .line{
    /* Tamaño que entra "Cardio Pulmonar" en una línea en col izquierda */
    font-size: clamp(2.6rem, 5.8vw, 4.6rem);
    font-weight: 700;
    color: var(--sb-text);
    letter-spacing: -.02em;
  }
  .wg-portada__title .outline{
    font-size: clamp(2.4rem, 5.4vw, 4.2rem);
    font-weight: 600;
    color: transparent;
    -webkit-text-stroke: 1.5px color-mix(in srgb, var(--sb-text) 50%, transparent);
    letter-spacing: -.02em;
  }
  .wg-portada__title .accent{
    font-size: clamp(2.8rem, 6.2vw, 5rem);
    font-weight: 700;
    color: var(--c-acento);
    letter-spacing: -.02em;
    margin-top: .1em;
  }

  /* Botón ghost sobre fondo navy de portada · legible */
  .wg-portada .wg-btn--ghost{
    color: var(--sb-text);
    border-color: color-mix(in srgb, var(--sb-text) 35%, transparent);
    background: transparent;
  }
  .wg-portada .wg-btn--ghost iconify-icon{ color: var(--sb-text); }
  .wg-portada .wg-btn--ghost:hover{
    background: color-mix(in srgb, var(--sb-text) 8%, transparent);
    border-color: color-mix(in srgb, var(--sb-text) 60%, transparent);
    color: var(--sb-text);
  }

  @media (max-width: 980px){
    .wg-portada__inner{
      grid-template-columns: 1fr;
      min-height: auto;
    }
    .wg-portada__hero{
      order:-1;
      margin: -24px -24px 0 -24px;
      justify-content:center;
    }
    .wg-portada__hero img{ max-height: 360px; }
    .wg-portada__title > span{ white-space: normal; }
  }
</style>
</head>
<body class="wg-body">

<button class="wg-burger" data-wg-burger><iconify-icon icon="mdi:menu"></iconify-icon></button>

<div class="wg-app">
  <aside class="wg-sidebar" data-wg-sidebar data-current="portada"></aside>

  <main class="wg-main">
    <div class="wg-topbar">
      <div class="wg-breadcrumb" data-wg-breadcrumb data-current="portada"></div>
      <div class="wg-topbar__actions">
        <div class="wg-version-switch" data-wg-version-switch></div>
        <a href="#" class="wg-iconbtn" title="Descargar material"><iconify-icon icon="mdi:download"></iconify-icon></a>
        <a href="bienvenida.html" class="wg-iconbtn wg-iconbtn--accent" title="Comenzar curso"><iconify-icon icon="mdi:arrow-right"></iconify-icon></a>
      </div>
    </div>

    <section class="wg-portada">
      <div class="wg-portada__grid"></div>
      <div class="wg-portada__inner" data-reveal>
        <div class="wg-portada__text">
          <div class="wg-portada__code">
            <iconify-icon icon="mdi:heart-pulse"></iconify-icon>
            CURSO RCP-2025 · ENTRENAMIENTO DEL PRIMER RESPONDIENTE
          </div>
          <h1 class="wg-portada__title">
            <span class="outline">Reanimación</span>
            <span class="line">Cardio Pulmonar</span>
            <span class="accent">(RCP)</span>
          </h1>

          <div class="wg-portada__stats">
            <div class="wg-portada__stat">
              <div class="value">8 <small>horas</small></div>
              <div class="label">Duración</div>
            </div>
            <div class="wg-portada__stat-sep"></div>
            <div class="wg-portada__stat">
              <div class="value">25 <small>pantallas</small></div>
              <div class="label">Estructura</div>
            </div>
            <div class="wg-portada__stat-sep"></div>
            <div class="wg-portada__stat">
              <div class="value">Primer<br/><small>respondiente</small></div>
              <div class="label">Audiencia</div>
            </div>
            <div class="wg-portada__stat-sep"></div>
            <div class="wg-portada__stat">
              <div class="value">Teoría <small>+ simulador VR</small></div>
              <div class="label">Modalidad</div>
            </div>
          </div>

          <div style="display:flex; gap:16px; flex-wrap:wrap; align-items:center;">
            <a href="bienvenida.html" class="wg-btn wg-btn--primary">
              Comenzar el curso <iconify-icon icon="mdi:arrow-right" class="arrow"></iconify-icon>
            </a>
            <a href="#" class="wg-btn wg-btn--ghost">
              <iconify-icon icon="mdi:download"></iconify-icon> Material PDF
            </a>
            <span style="font-family:var(--font-mono); font-size:.78rem; color:var(--sb-text-mut); display:flex; align-items:center; gap:8px;">
              <iconify-icon icon="mdi:certificate-outline" style="color:var(--c-info); font-size:1.1rem;"></iconify-icon>
              Recurso educativo · ISO 9001:2015
            </span>
          </div>
        </div>

        <div class="wg-portada__hero" aria-hidden="true">
          <img src="assets/img/curso/p01-hero-silueta.webp" alt="" />
        </div>
      </div>
    </section>

    <nav class="wg-screen-nav" data-wg-screen-nav data-current="portada"></nav>
  </main>
</div>

<script src="assets/js/course.js"></script>
<script src="assets/js/core.js"></script>
</body>
</html>
