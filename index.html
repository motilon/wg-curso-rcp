<!doctype html>
<html lang="es" data-version="hibrida">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Inicio · Reanimación Cardiopulmonar Básico (RCP)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<link rel="stylesheet" href="assets/css/presets/theme-vital.css" />
<link rel="stylesheet" href="assets/css/core.css" />
<style>
  /* =============================================================
     PORTADA · fondo simulado con CSS (recrea el banner Waygroup)
     - Dots pattern · curva decorativa · bokeh (modo claro) · logo
     - Silueta del instructor encima a la derecha
     ============================================================= */
  .wg-portada{
    position: relative;
    overflow: hidden;
    isolation: isolate;
    /* Fondo del banner real: --c-deep + halo cyan --c-info
       (mismo lenguaje cromático que el sidebar y el banner Waygroup) */
    background:
      /* Halo cyan superior-derecha · da vida al navy */
      radial-gradient(ellipse 80% 70% at 78% 40%,
        color-mix(in srgb, var(--c-info) 35%, transparent) 0%,
        color-mix(in srgb, var(--c-info) 12%, transparent) 35%,
        transparent 65%),
      /* Capa base que oscurece esquinas */
      radial-gradient(ellipse 110% 90% at 30% 50%,
        color-mix(in srgb, var(--c-deep) 92%, #000) 0%,
        var(--c-deep) 60%,
        color-mix(in srgb, var(--c-deep) 75%, var(--c-info)) 100%);
  }
  [data-version="hibrida"] .wg-portada{
    background:
      radial-gradient(ellipse 80% 70% at 78% 40%,
        color-mix(in srgb, var(--c-info) 35%, transparent) 0%,
        color-mix(in srgb, var(--c-info) 12%, transparent) 35%,
        transparent 65%),
      radial-gradient(ellipse 110% 90% at 30% 50%,
        color-mix(in srgb, var(--c-deep) 92%, #000) 0%,
        var(--c-deep) 60%,
        color-mix(in srgb, var(--c-deep) 75%, var(--c-info)) 100%);
  }

  /* DOTS PATTERN · solo en modo claro
     (en oscuro queda fondo limpio sin grilla) */
  .wg-portada::before{
    content: "";
    position: absolute;
    inset: 0;
    background-image: none;
    background-size: 22px 22px;
    background-position: 0 0;
    -webkit-mask-image: linear-gradient(105deg, transparent 0%, #000 25%, #000 100%);
            mask-image: linear-gradient(105deg, transparent 0%, #000 25%, #000 100%);
    z-index: 0;
    pointer-events: none;
  }

  /* CURVA DECORATIVA · arco blanco/cyan abajo derecha (SVG inline en pseudo) */
  .wg-portada::after{
    content: "";
    position: absolute;
    right: -40px;
    bottom: -80px;
    width: 60%;
    height: 320px;
    background:
      radial-gradient(ellipse at 100% 100%,
        transparent 58%,
        color-mix(in srgb, var(--c-info) 40%, transparent) 59%,
        color-mix(in srgb, var(--c-info) 25%, transparent) 60%,
        transparent 62%),
      radial-gradient(ellipse at 100% 100%,
        transparent 64%,
        color-mix(in srgb, var(--sb-text) 18%, transparent) 65%,
        transparent 67%);
    filter: blur(.4px);
    z-index: 0;
    pointer-events: none;
    opacity: .9;
  }

  /* Logo Waygroup (SVG) esquina superior derecha */
  .wg-portada__logo{
    position: absolute;
    top: 28px;
    right: 32px;
    z-index: 3;
    display: inline-flex;
    align-items: center;
  }
  .wg-portada__logo img{
    display: block;
    height: 96px;
    width: auto;
    filter: drop-shadow(0 6px 18px rgba(0,0,0,.3));
  }
  /* Logo "For Education" a color · la llama clara y el naranja resaltan sobre el navy */
  [data-version="hibrida"] .wg-portada__logo img{
    filter: drop-shadow(0 6px 18px rgba(0,0,0,.35));
  }
  /* Truco visual: pintar el naranja del logo aparte vía mix-blend
     usando un pseudo · pero más simple: en oscuro mantenemos blanco puro.
     Si querés el naranja vivo, lo agregamos como svg externo. */
  @media (max-width: 720px){
    .wg-portada__logo{ top: 18px; right: 18px; }
    .wg-portada__logo img{ height: 68px; }
  }

  /* Layout · texto ocupa ~55% izq, silueta anclada al fondo der absoluta */
  .wg-portada__inner{
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    align-items: center;
    min-height: 640px;
    /* dejar aire a la derecha donde queda la silueta absoluta */
    padding-right: clamp(0px, 42vw, 720px);
  }
  .wg-portada__text{ position: relative; z-index: 2; }

  /* SILUETA · enmarcada en círculo PERFECTO con borde acento + halo cyan */
  .wg-portada__hero{
    position: absolute;
    top: 50%;
    right: clamp(24px, 5vw, 80px);
    transform: translateY(-50%);
    /* Tamaño con UN SOLO valor para garantizar cuadrado real */
    --wg-circle: clamp(280px, 28vw, 420px);
    width: var(--wg-circle);
    height: var(--wg-circle);
    z-index: 1;
    pointer-events: none;
    /* Borde naranja fino */
    border: 2px solid color-mix(in srgb, var(--c-acento) 70%, transparent);
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%,
        color-mix(in srgb, var(--c-info) 14%, var(--c-deep)) 0%,
        color-mix(in srgb, var(--c-deep) 92%, #000) 80%);
    /* Glow cyan detrás del círculo */
    box-shadow:
      0 0 0 8px color-mix(in srgb, var(--c-acento) 12%, transparent),
      0 30px 60px rgba(0,0,0,.55),
      0 0 120px color-mix(in srgb, var(--c-info) 38%, transparent),
      0 0 240px color-mix(in srgb, var(--c-info) 18%, transparent);
    overflow: hidden;
  }
  .wg-portada__hero img{
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
  }

  /* Versión clara · ajustar el fondo interno del círculo */
  [data-version="clara"] .wg-portada__hero{
    background:
      radial-gradient(circle at 50% 50%,
        rgba(220, 235, 250, .9) 0%,
        rgba(200, 220, 240, .7) 80%);
    border-color: color-mix(in srgb, var(--c-acento) 80%, transparent);
    box-shadow:
      0 0 0 8px color-mix(in srgb, var(--c-acento) 14%, transparent),
      0 30px 60px rgba(20, 50, 100, .25),
      0 0 120px rgba(80, 140, 200, .35),
      0 0 240px rgba(80, 140, 200, .18);
  }

  /* ===========  VERSIÓN CLARA  ============= */
  [data-version="clara"] .wg-portada{
    background:
      /* Bokeh · círculos difusos de luz */
      radial-gradient(circle at 15% 30%,  rgba(180,210,240,.55) 0%, transparent 8%),
      radial-gradient(circle at 28% 60%,  rgba(190,220,245,.45) 0%, transparent 6%),
      radial-gradient(circle at 8%  78%,  rgba(170,205,240,.40) 0%, transparent 10%),
      radial-gradient(circle at 38% 18%,  rgba(200,225,250,.40) 0%, transparent 5%),
      radial-gradient(circle at 22% 88%,  rgba(180,215,245,.35) 0%, transparent 7%),
      radial-gradient(ellipse 60% 70% at 30% 50%,
        rgba(220,235,250,.7) 0%, transparent 70%),
      linear-gradient(120deg, #f3f7fc 0%, #e7eff8 60%, #dfeaf6 100%);
  }
  [data-version="clara"] .wg-portada::before{
    background-image: radial-gradient(
      circle,
      rgba(60, 110, 170, .18) 1.4px,
      transparent 1.6px
    );
  }
  [data-version="clara"] .wg-portada::after{
    background:
      radial-gradient(ellipse at 100% 100%,
        transparent 58%,
        rgba(120, 165, 215, .55) 59%,
        rgba(120, 165, 215, .35) 60%,
        transparent 62%),
      radial-gradient(ellipse at 100% 100%,
        transparent 64%,
        rgba(255,255,255,.75) 65%,
        transparent 67%);
    opacity: 1;
  }
  [data-version="clara"] .wg-portada__logo{ color: #0b2240; }
  [data-version="clara"] .wg-portada__logo small{
    color: rgba(11, 34, 64, .55);
  }
  /* drop-shadow REMOVIDO de la imagen porque rompía el clipping del border-radius
     en modo claro. El halo ahora vive en el box-shadow del contenedor (que sí
     respeta el border-radius). */
  [data-version="clara"] .wg-portada__title .outline{
    color: rgba(11, 34, 64, .55);
  }
  [data-version="clara"] .wg-portada__title .line{
    color: #0b2240;
  }
  [data-version="clara"] .wg-portada__intro{
    color: rgba(11, 34, 64, .85);
  }

  /* Título del curso · Apple-style (SF Pro Display nativo en Mac/iOS,
     Inter como fallback de calidad) — sin serifs, geométrico y limpio */
  .wg-portada__title{
    display: flex;
    flex-direction: column;
    line-height: 1;
    margin: 0;
    font-family:
      -apple-system, BlinkMacSystemFont,
      "SF Pro Display", "SF Pro Text",
      'Inter', system-ui,
      "Helvetica Neue", Arial, sans-serif;
    font-feature-settings: "ss01" on, "cv11" on, "calt" on;
  }
  .wg-portada__title > span{
    display: block;
    white-space: nowrap;
  }
  /* "Reanimación" · light, sólido pero sutil */
  .wg-portada__title .outline{
    font-size: clamp(2.4rem, 5.2vw, 4rem);
    font-weight: 200;
    color: color-mix(in srgb, var(--sb-text) 75%, transparent);
    letter-spacing: -.025em;
    margin-bottom: .04em;
  }
  /* "Cardiopulmonar" · heavy display tipo Apple Hero */
  .wg-portada__title .line{
    font-size: clamp(3rem, 6.4vw, 5.2rem);
    font-weight: 800;
    color: var(--sb-text);
    letter-spacing: -.035em;
  }
  /* "(RCP)" · black peso máximo en acento */
  .wg-portada__title .accent{
    font-size: clamp(3.2rem, 7vw, 5.8rem);
    font-weight: 900;
    color: var(--c-acento);
    letter-spacing: -.045em;
    margin-top: .04em;
  }

  /* Párrafo intro debajo del título */
  .wg-portada__intro{
    margin: 28px 0 0;
    max-width: 38ch;
    font-size: clamp(1.05rem, 1.4vw, 1.2rem);
    line-height: 1.55;
    color: color-mix(in srgb, var(--sb-text) 88%, transparent);
    border-left: 3px solid var(--c-acento);
    padding: 6px 0 6px 18px;
  }

  /* Botón ghost sobre fondo navy de portada · legible */
  .wg-portada .wg-btn--ghost{
    color: var(--sb-text);
    border-color: color-mix(in srgb, var(--sb-text) 35%, transparent);
    background: transparent;
  }
  .wg-portada .wg-btn--ghost iconify-icon{ color: var(--sb-text); }
  .wg-portada .wg-btn--ghost:hover{
    background: color-mix(in srgb, var(--sb-text) 8%, transparent);
    border-color: color-mix(in srgb, var(--sb-text) 60%, transparent);
    color: var(--sb-text);
  }

  /* Tablet y mobile · ocultar la figura para dar más respiro al texto */
  @media (max-width: 1024px){
    .wg-portada__inner{
      padding-right: 0;
      min-height: auto;
    }
    .wg-portada__hero{ display: none; }
    .wg-portada__title > span{ white-space: normal; }
  }
</style>
</head>
<body class="wg-body">

<button class="wg-burger" data-wg-burger><iconify-icon icon="mdi:menu"></iconify-icon></button>

<div class="wg-app">
  <aside class="wg-sidebar" data-wg-sidebar data-current="portada"></aside>

  <main class="wg-main">
    <div class="wg-topbar">
      <div class="wg-breadcrumb" data-wg-breadcrumb data-current="portada"></div>
      <div class="wg-topbar__actions">
        <div class="wg-version-switch" data-wg-version-switch></div>
        <a href="assets/downloads/Curso_RCP.pdf" class="wg-iconbtn" title="Descargar PDF del curso" download><iconify-icon icon="mdi:download"></iconify-icon></a>
        <a class="wg-iconbtn wg-iconbtn--accent" data-wg-next-iconbtn title="Siguiente"><iconify-icon icon="mdi:arrow-right"></iconify-icon></a>
      </div>
    </div>

    <section class="wg-portada">
      <div class="wg-portada__grid"></div>

      <!-- Logo Waygroup (SVG oficial) esquina superior derecha -->
      <div class="wg-portada__logo" aria-hidden="true">
        <img src="assets/img/curso/waygroup-for-education.svg" alt="WAYGROUP for education" />
      </div>

      <div class="wg-portada__inner" data-reveal>
        <div class="wg-portada__text">
          <h1 class="wg-portada__title">
            <span class="outline">Reanimación</span>
            <span class="line">Cardiopulmonar</span>
            <span class="line">Básico</span>
            <span class="accent">(RCP)</span>
          </h1>

          <p class="wg-portada__intro">
            En este curso aprenderás cómo actuar ante una persona que presenta una
            posible parada cardíaca.
          </p>

          <div style="display:flex; gap:16px; flex-wrap:wrap; align-items:center; margin-top:32px;">
            <a href="bienvenida.html" class="wg-btn wg-btn--primary">
              Comenzar el curso <iconify-icon icon="mdi:arrow-right" class="arrow"></iconify-icon>
            </a>
            <a href="assets/downloads/Curso_RCP.pdf" class="wg-btn wg-btn--ghost" download title="Descargar PDF del curso">
              <iconify-icon icon="mdi:file-pdf-box"></iconify-icon>
              Material PDF
            </a>
          </div>

          <img src="assets/img/curso/sello-iso-9001.svg" alt="Certificación ISO 9001:2015" style="margin-top:36px; height:104px; width:auto; display:block;" />
        </div>

        <div class="wg-portada__hero" aria-hidden="true">
          <img src="assets/img/curso/p01-hero-persona.png" alt="" />
        </div>
      </div>
    </section>

  </main>
</div>

<script src="assets/js/course.js"></script>
<script src="assets/js/core.js"></script>
</body>
</html>
