<!doctype html>
<html lang="es" data-version="hibrida">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Referencias y créditos · Template Waygroup OVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<link rel="stylesheet" href="assets/css/presets/theme-vital.css" />
<link rel="stylesheet" href="assets/css/core.css" />
<style>
  .wg-creditos { display: grid; gap: 24px; }
  .wg-creditos__block { background: var(--bg-surface); border-radius: var(--r-lg); padding: 32px; border: 1px solid var(--border-c); }
  .wg-creditos__block h3 { font-size: .85rem; letter-spacing: .18em; text-transform: uppercase; color: var(--c-acento); margin-bottom: 20px; }
  .wg-creditos__people { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
  .wg-creditos__person strong { display: block; font-family: var(--font-display); font-size: 1rem; color: var(--text-head); }
  .wg-creditos__person span { display: block; font-size: .85rem; color: var(--text-mut); }
  .wg-ref-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .wg-ref-list li { font-size: .92rem; padding: 12px 16px; background: var(--bg-muted); border-left: 3px solid var(--c-acento); border-radius: 6px; color: var(--text-pri); }
</style>
</head>
<body class="wg-body">
<button class="wg-burger" data-wg-burger><iconify-icon icon="mdi:menu"></iconify-icon></button>
<div class="wg-app">
  <aside class="wg-sidebar" data-wg-sidebar data-current="creditos"></aside>
  <main class="wg-main">
    <div class="wg-topbar">
      <div class="wg-breadcrumb" data-wg-breadcrumb data-current="creditos"></div>
      <div class="wg-topbar__actions">
        <div class="wg-version-switch" data-wg-version-switch></div>
        <a href="presets.html" class="wg-iconbtn"><iconify-icon icon="mdi:palette"></iconify-icon></a>
        <a href="showcase.html" class="wg-iconbtn wg-iconbtn--accent"><iconify-icon icon="mdi:view-grid"></iconify-icon></a>
      </div>
    </div>

    <article class="wg-screen">
      <header class="wg-screen__head" data-reveal>
        <div class="wg-screen__eyebrow">Pantalla 07 · Cierre</div>
        <h1 class="wg-screen__title">Referencias y créditos</h1>
        <p class="wg-screen__lead">Auto-renderizado desde <code>referencias</code> y <code>creditos</code> en <code>course.js</code>.</p>
      </header>

      <div class="wg-creditos">
        <div class="wg-creditos__block" data-reveal>
          <h3>— Referencias</h3>
          <ul class="wg-ref-list" data-wg-refs></ul>
        </div>
        <div class="wg-creditos__block" data-reveal data-wg-creditos></div>
        <div class="wg-creditos__block" data-reveal>
          <h3>— Certificación y licencia</h3>
          <p style="margin:0;">
            Recurso educativo certificado bajo <strong data-wg-iso>ISO 9001:2015</strong>.
            Distribuido bajo licencia <strong data-wg-licencia>Creative Commons BY-NC-SA 4.0</strong>.
          </p>
        </div>
      </div>
    </article>
    <nav class="wg-screen-nav" data-wg-screen-nav data-current="creditos"></nav>
  </main>
</div>
<script src="assets/js/course.js"></script>
<script src="assets/js/core.js"></script>
<script>
  (function () {
    const C = window.WG_COURSE; if (!C) return;
    const refs = document.querySelector('[data-wg-refs]');
    if (refs && C.referencias) refs.innerHTML = C.referencias.map(r => `<li>${r.texto}</li>`).join('');
    const cred = document.querySelector('[data-wg-creditos]');
    if (cred && C.creditos?.bloques) {
      cred.innerHTML = C.creditos.bloques.map(b => `
        <h3>— ${b.titulo}</h3>
        <div class="wg-creditos__people">
          ${b.personas.map(p => `
            <div class="wg-creditos__person">
              <strong>${p.nombre}</strong>
              <span>${p.cargo}</span>
              <span>${p.area || ''}</span>
            </div>
          `).join('')}
        </div>
      `).join('<hr style="border:none; border-top:1px dashed var(--border-c); margin:24px 0;">');
    }
    if (C.course?.iso) document.querySelector('[data-wg-iso]').textContent = C.course.iso;
    if (C.course?.licencia) document.querySelector('[data-wg-licencia]').textContent = C.course.licencia;
  })();
</script>
</body>
</html>
